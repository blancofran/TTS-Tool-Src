name: Build TTS Tool

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build"
        type: choice
        default: all
        options:
          - all
          - linux
          - macos
          - windows
  push:
    tags:
      - "v*"

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        run: |
          case "${{ github.event.inputs.platform || 'all' }}" in
            linux)
              echo 'include=[{"platform":"ubuntu-22.04","args":""}]' >> "$GITHUB_OUTPUT"
              ;;
            macos)
              echo 'include=[{"platform":"macos-latest","args":""}]' >> "$GITHUB_OUTPUT"
              ;;
            windows)
              echo 'include=[{"platform":"windows-latest","args":""}]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'include=[{"platform":"macos-latest","args":""},{"platform":"ubuntu-22.04","args":""},{"platform":"windows-latest","args":""}]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: matrix-prep
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-prep.outputs.include) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Download bundled Whisper model (Windows)
        if: matrix.platform == 'windows-latest'
        run: ./scripts/download-models.ps1 small
        shell: pwsh

      - name: Download bundled Whisper model (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        run: ./scripts/download-models.sh small

      - name: Build app and publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "TTS Tool v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
